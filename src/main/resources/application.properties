chroma.initial-topics=

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-request=true

# Frontend'in CORS icin izinli origin'leri (virgulle ayrilmis)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Goruntu (jpg/png) OCR icin Tesseract-OCR kurulu olmali.
# Kurulum sonrasi tessdata klasor yolunu asagida belirtin (orn: C:/Program Files/Tesseract-OCR/tessdata)
ocr.tessdata-path=
ocr.language=tur

# API key koruma - Chroma'dan gecen endpoint'ler (/rag/*, /locate/*) vs digerleri
security.api-key.chroma=meu-ai-chatbox
security.api-key.admin=meu-baum-adminkey

# PDF konum bulucu (/locate) - sayfa bazli, ayri Chroma collection'i kullanir
locate.chroma.collection=70262b7d-fbbc-402b-a2dc-881a4860a4a3
locate.distance-threshold=340.0
locate.max-results=5

# External API entegrasyonu (/sync) - dokuman kaynagi artık yerel klasor
# degil, kurum ici External API (EXTERNAL_API_GUIDE.md). /sync/run manuel
# tetiklenir; since/next_cursor ile kaldigi yerden devam eder.
external-api.base-url=https://www2.mersin.edu.tr/api/external/v1
external-api.api-key=PvfYufvP3b1BjHEjNJhimQ4XTS1igMOvinFKzOLo
external-api.initial-since=1970-01-01T00:00:00Z
external-api.page-size=100
# /documents/changes cagrisi icin timeout (sn)
external-api.request-timeout-seconds=30
# cdn'den dosya indirme icin timeout (sn) - yavas/takilan baglanti
# sonsuza kadar beklemesin diye; asilirsa dosya "failed" sayilir
external-api.download-timeout-seconds=120

# Chroma HTTP cagrilari (add/delete/query) icin timeout (sn)
chroma.timeout-seconds=30
# Ollama embedding cagrisi icin timeout (sn)
spring.ai.ollama.embedding.timeout-seconds=60
