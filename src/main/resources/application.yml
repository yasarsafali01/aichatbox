spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  ai:
    ollama:
      base-url: http://localhost:11434
      rag:
        model: qwen2.5 # kolayca değiştirilebilsin
        keep-alive: 30m # model belleğe yüklü kalsın, her istekte reload olmasın
        think: false # qwen3/deepseek-r1 gibi "thinking" modellerinde akıl yürütme adımını açar/kapatır
        timeout-seconds: 180 # yanıt üretme çağrısı için timeout
        models-cache-ttl-seconds: 60 # /rag/models sonucunu bu sürede bir Ollama'dan tazeler

      chat:
        options:
          model: qwen2.5

      embedding:
        options:
          model: nomic-embed-text

chroma:
  base-url: http://[::1]:8000
  tenant-id: default_tenant
  database: default_database
  collection: df948403-5a1f-4105-9c18-8a3bc43dbf06
  distance-threshold: 220.0